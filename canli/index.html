<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050d13">
<meta name="description" content="Bilgi Dozu üretim ofisinin canlı akışı: 9 maskot, gerçek yayın verileri ve sessiz ofis görünümü.">
<title>Canlı Akış · Bilgi Dozu</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#040a10}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#dbe7f3;-webkit-font-smoothing:antialiased;user-select:none}
  #app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
  #sceneWrap{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
      background:radial-gradient(115% 85% at 50% 40%,rgba(28,88,116,.26),transparent 64%),
                 radial-gradient(80% 60% at 50% 105%,rgba(10,42,62,.45),transparent 72%),#030a10}
  #sceneWrap::after{content:"";position:absolute;inset:0;pointer-events:none;
      box-shadow:inset 0 0 150px rgba(0,0,0,.6),inset 0 1px 0 rgba(157,235,231,.07)}
  #scene{position:absolute;left:50%;top:50%;width:1280px;height:800px;display:block;transform-origin:center center;transform:translate(-50%,-50%)}

  #top{position:relative;flex:none;height:56px;display:flex;align-items:center;gap:20px;justify-content:space-between;
       padding:0 18px;background:linear-gradient(180deg,rgba(4,10,16,.96) 0%,rgba(4,10,16,.5) 66%,transparent 100%);z-index:3}
  .brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;letter-spacing:.18em;color:#eaf6ff;
         text-decoration:none;white-space:nowrap;flex:none}
  .brand .logo{color:#9debe7;font-size:16px;text-shadow:0 0 14px rgba(157,235,231,.9)}
  .brand .sep{color:#2c4459;font-weight:400}
  .brand em{font-style:normal;font-weight:500;font-size:10.5px;letter-spacing:.2em;color:#7d97ad}

  #siteNav{display:flex;align-items:center;gap:22px;font-size:11.5px;color:#a8bec0;margin-left:8px;margin-right:auto}
  #siteNav a{color:inherit;text-decoration:none;letter-spacing:.02em;transition:color .2s;white-space:nowrap}
  #siteNav a:hover{color:#9debe7}
  #siteNav a.active{color:#9debe7;font-weight:700}
  #siteNav a.active::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#9debe7;
         box-shadow:0 0 8px #9debe7;margin-right:6px;vertical-align:middle;animation:blink 1.8s infinite}

  .right{display:flex;align-items:center;gap:12px;flex:none}
  .badge{display:flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.18em;font-weight:700;color:#f6cc7a;
         border:1px solid rgba(246,204,122,.35);background:rgba(246,204,122,.07);padding:4px 10px;border-radius:20px;white-space:nowrap}
  .badge i{width:5px;height:5px;border-radius:50%;background:#f6cc7a;box-shadow:0 0 8px #f6cc7a;animation:blink 1.8s infinite}
  .badge.canli{color:#8ef0c0;border-color:rgba(142,240,192,.4);background:rgba(142,240,192,.08)}
  .badge.canli i{background:#8ef0c0;box-shadow:0 0 8px #8ef0c0}
  #date{font-size:10px;letter-spacing:.16em;color:#7d97ad;white-space:nowrap}
  #clock{font-size:13px;color:#cfe6f5;white-space:nowrap}
  #fs{height:27px;width:27px;border-radius:7px;border:1px solid rgba(150,220,230,.24);background:rgba(120,200,255,.06);color:#9fb6c9;font-size:13px;cursor:pointer;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  #fs:hover{color:#9debe7;border-color:rgba(157,235,231,.55)}

  #stats{flex:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;
      background:linear-gradient(90deg,rgba(120,200,255,.14),rgba(120,200,255,.05));
      border-top:1px solid rgba(120,200,255,.15);box-shadow:0 -14px 40px rgba(0,0,0,.35)}
  .stat{display:flex;flex-direction:column;gap:1px;padding:8px 13px 7px;background:rgba(4,12,19,.96);
      position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
      background:linear-gradient(180deg,rgba(157,235,231,.5),transparent)}
  .stat .k{font-size:8px;letter-spacing:.18em;color:#557a92;text-transform:uppercase;font-weight:600}
  .stat b{font-size:16px;font-weight:700;color:#c8fbf6;line-height:1.15;
      font-family:ui-monospace,"Roboto Mono",Menlo,monospace;font-variant-numeric:tabular-nums;
      text-shadow:0 0 16px rgba(34,211,238,.35)}
  .stat em{font-style:normal;font-size:8.5px;letter-spacing:.04em;color:#6b8aa0}
  #stLive{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:6px 13px;
      background:rgba(3,10,16,.97);border-top:1px solid rgba(120,200,255,.07);font-size:9.5px;
      letter-spacing:.05em;color:#8fb0c8;min-width:0}
  #stLive b{font-size:8px;letter-spacing:.18em;color:#9debe7;flex:none}
  #stNext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:#a9c6d6}
  #stUpdated{margin-left:auto;flex:none;font-size:8px;letter-spacing:.12em;color:#43616f}
  .liveDot{width:5px;height:5px;border-radius:50%;background:#8ef0c0;box-shadow:0 0 8px #8ef0c0;
      flex:none;animation:blink 1.8s infinite}
  #stQuota{display:none;grid-column:1/-1;gap:6px 12px;padding:8px 13px 10px;
      background:rgba(4,12,19,.96);border-top:1px solid rgba(120,200,255,.07);
      grid-template-columns:repeat(2,minmax(0,1fr))}
  .q{display:flex;flex-direction:column;gap:3px;min-width:0}
  .q .qt{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.1em;color:#6f8aa3}
  .q .qt b{color:#9debe7;font-weight:700;font-variant-numeric:tabular-nums}
  .q .bar{height:3px;border-radius:2px;background:rgba(120,200,255,.14);overflow:hidden}
  .q .bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#38bdf8,#8ef0c0)}
  #stWorkers{display:none;grid-column:1/-1;gap:6px 10px;padding:9px 13px;
      background:rgba(4,12,19,.96);border-top:1px solid rgba(120,200,255,.07);
      grid-template-columns:repeat(3,minmax(0,1fr))}
  .wchip{display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:.05em;color:#9fb6c9;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wchip i{width:5px;height:5px;border-radius:50%;flex:none}
  @media (max-aspect-ratio:1/1){
    #stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .stat{padding:10px 13px 9px}
    .stat b{font-size:19px}
    #stWorkers{display:grid}
    #stQuota{display:grid}
    #top{height:52px}
    #ticker{height:40px}
  }
  @media (max-height:480px) and (min-aspect-ratio:1/1){#stats{display:none}}

  .mono{font-family:ui-monospace,"Roboto Mono",Menlo,Consolas,monospace}
  #ticker{position:relative;flex:none;height:44px;display:flex;align-items:center;gap:10px;padding:0 20px;
          background:linear-gradient(0deg,rgba(4,10,16,.97) 0%,rgba(4,10,16,.62) 55%,transparent 100%);z-index:3;font-size:11px}
  #ticker .dot{width:6px;height:6px;border-radius:50%;background:#9debe7;box-shadow:0 0 10px #9debe7;flex:none}
  #tkTime{color:#5d7d94;font-size:10px}
  #tkWho{font-size:9px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;color:#9debe7;min-width:74px}
  #tkMsg{color:#c3d5e3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
  #ticker .src{margin-left:auto;font-size:8.5px;letter-spacing:.16em;color:#3f5a6e;flex:none}

  @media (max-width:1080px){#siteNav{display:none}}
  @media (max-width:720px){#date{display:none}}

  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
</style>

<body>
<div id="app">
  <header id="top">
    <a class="brand" href="https://benngokhan.github.io/">

      <span class="badge" id="mode"><i></i><span id="modeText">REPLAY</span></span>

    <canvas id="scene"></canvas>

    <div class="stat"><span class="k">Abone</span><b id="stAbone">—</b><em id="stYorum">—</em></div>

    <span class="src" id="tkSrc">REPLAY · KAYITLI GERÇEK OLAYLAR</span>
  </footer>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   BİLGİDOZU · ÜRETİM OFİSİ  (göz hizası / perspektif görünüm)
   Arka duvar, pencereli oda, derinlikli zemin. 9 maskot masalarında
   çalışır; olay olunca biri evrakı kapıp koridordan arkadaşına gider.
   Veri: ./data/canli.json · "replay" = kayıtlı gerçek olaylar
   ═══════════════════════════════════════════════════════════════════ */

const FALLBACK = {
  mod: "replay", mod_etiketi: "REPLAY · 21 KAS 2026",
  sistem: { slot_saati: "19:30" },
  kanal: { izlenme: 56398, abone: 81, video: 103, yorum: 39, begeni: 256 },
  kuyruk: { shorts: 19, gun: 19, sonraki: "video_183" },
  isci: [
    {id:"motor",durum:"bekliyor"},{id:"planlayici",durum:"beklemede"},{id:"yukleyici",durum:"tamam"},
    {id:"kapak",durum:"tamam"},{id:"yorum",durum:"tamam"},{id:"analitik",durum:"tamam"},
    {id:"kota",durum:"ok"},{id:"watchdog",durum:"beklemede"},{id:"arsiv",durum:"tamam"}
  ],
  akis: [
    {t:"11:08",isci:"planlayici",metin:"5 günlük plan güncel · 19 Shorts stok, eksik kapak yok"},
    {t:"14:26",isci:"telemetri",metin:"Drive stoğu senkronlandı · 19 Shorts, sıradaki video_183",kenar:"drive-slot"},
    {t:"19:12",isci:"yukleyici",metin:"Kuyruk ısıtıldı · Drive ve tablo kontrol edildi",kenar:"drive-slot"},
    {t:"19:15",isci:"kapak",metin:"video_182 için hazır Drive kapağı uygulandı",kenar:"yt-kapak"},
    {t:"19:16",isci:"yorum",metin:"video_182 altına ilk sabit yorum yazıldı",kenar:"kapak-yorum"},
    {t:"19:30",isci:"yukleyici",metin:"19:30 yayın slotu açıldı",kenar:"slot-yt"},
    {t:"19:31",isci:"yukleyici",metin:"video_182 yayınlandı · youtu.be/_J95OOCW488",kenar:"slot-yt"},
    {t:"19:50",isci:"watchdog",metin:"Slot watchdog erken uyarıyı geçti · slot sağlıklı",kenar:"drive-slot"},
    {t:"20:09",isci:"analitik",metin:"30 videonun görüntülenme verisi güncellendi",kenar:"yorum-analitik"}
  ]
};

/* ── sahne ölçüleri ── */
const W = 1280, H = 800;
const TAU = Math.PI * 2;
const WALL = 300;                        // duvar/zemin sınırı
const VP = { x: 640, y: 252 };           // perspektif kaçış noktası
const COLS = [300, 640, 980];
const ROWS = [
  { y: 392, s: 0.82 },                   // arka sıra
  { y: 546, s: 0.95 },                   // orta sıra
  { y: 706, s: 1.09 }                    // ön sıra
];
const LANE_Y = [462, 612, 620];          // sıra koridorları
const VERT = [430, 834];                 // dikey koridorlar
const PROP_LANE = 352;                   // eşyaların önündeki hat

const WORKERS = [
  { id:"motor",      label:"MOTOR",     emoji:"🎬", c:"#22d3ee", row:0, col:0 },
  { id:"planlayici", label:"PLAN",      emoji:"📅", c:"#a78bfa", row:0, col:1 },
  { id:"yukleyici",  label:"YÜKLEYİCİ", emoji:"🚀", c:"#34d399", row:0, col:2 },
  { id:"kapak",      label:"KAPAK",     emoji:"🖼️", c:"#f472b6", row:1, col:0 },
  { id:"yorum",      label:"YORUM",     emoji:"💬", c:"#fbbf24", row:1, col:1 },
  { id:"analitik",   label:"ANALİTİK",  emoji:"📊", c:"#38bdf8", row:1, col:2 },
  { id:"kota",       label:"KOTA",      emoji:"🔋", c:"#f87171", row:2, col:0 },
  { id:"watchdog",   label:"WATCHDOG",  emoji:"🛡️", c:"#94a3b8", row:2, col:1 },
  { id:"arsiv",      label:"ARŞİV",     emoji:"📦", c:"#fb923c", row:2, col:2 }
];

const PROPS = [
  { id:"drive", label:"DRİVE",   emoji:"☁️", c:"#7dd3fc", x:112,  y:352, w:104, h:150, top:202 },
  { id:"slot",  label:"SLOT",    emoji:"⏰", c:"#fbbf24", x:490,  y:366, w:80,  h:126, top:240 },
  { id:"yt",    label:"YOUTUBE", emoji:"▶️", c:"#ef4444", x:1120, y:372, w:216, h:138, top:100 }
];

const DURUM_RENK = { tamam:"#34d399", ok:"#34d399", beklemede:"#64748b", bekliyor:"#64748b", hata:"#f87171" };
const ROUTES = {
  "motor-drive":    ["motor", "drive"],
  "drive-slot":     ["drive", "yukleyici"],
  "slot-yt":        ["yukleyici", "yt"],
  "yt-kapak":       ["yt", "kapak"],
  "kapak-yorum":    ["kapak", "yorum"],
  "yorum-analitik": ["yorum", "analitik"]
};
const AYLAR = ["OCA","ŞUB","MAR","NİS","MAY","HAZ","TEM","AĞU","EYL","EKİ","KAS","ARA"];

/* ── yerleşim ── */
const PLACES = {};
function scaleAtY(y){
  return Math.max(0.76, Math.min(1.16, 0.80 + (y - 330) * 0.00075));
}
WORKERS.forEach(w => {
  const r = ROWS[w.row];
  PLACES[w.id] = {
    id:w.id, type:"desk", x:COLS[w.col], y:r.y, row:w.row, s:r.s,
    standX: COLS[w.col] + 66 * r.s, c:w.c, label:w.label, emoji:w.emoji
  };
});
PROPS.forEach(p => {
  PLACES[p.id] = {
    id:p.id, type:"prop", x:p.x, y:p.y, c:p.c, label:p.label,
    emoji:p.emoji, prop:p, s: scaleAtY(p.y)
  };
});

/* ── canvas ── */
const CV = document.getElementById("scene");
const X = CV.getContext("2d");
const nf = new Intl.NumberFormat("tr-TR");
const pad = n => String(n).padStart(2, "0");

function setupCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  CV.width = W * dpr; CV.height = H * dpr;
  CV.style.width = W + "px"; CV.style.height = H + "px";
  X.setTransform(dpr, 0, 0, dpr, 0, 0);
  X.textBaseline = "middle";
}

/* ── durum ── */
let D = FALLBACK, time = 0, last = 0;
const mascots = {};
const jobs = [];
const pending = [];
const parts = [];
const confetti = [];
let bubble = null;

/* ── yardımcı ── */
function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function rr(x,y,w,h,r){
  X.beginPath();
  if (X.roundRect) X.roundRect(x,y,w,h,r);
  else { X.moveTo(x+r,y); X.arcTo(x+w,y,x+w,y+h,r); X.arcTo(x+w,y+h,x,y+h,r); X.arcTo(x,y+h,x,y,r); X.arcTo(x,y,x+w,y,r); X.closePath(); }
}
function accent(id){
  const w = (D.isci || []).find(x => x.id === id);
  return DURUM_RENK[w?.durum] || "#34d399";
}
function vgrad(x, y0, y1, c0, c1){
  const g = X.createLinearGradient(x, y0, x, y1);
  g.addColorStop(0, c0); g.addColorStop(1, c1);
  return g;
}


/* ── yol ── */
function mkPath(pts){
  const segs = []; let total = 0;
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i+1];
    const d = Math.hypot(b.x-a.x, b.y-a.y);
    if (d < 1) continue;
    segs.push({ a, b, d, start: total });
    total += d;
  }
  return { segs, total };
}
function posAt(p, s){
  if (!p.segs.length) return { x:0, y:0 };
  s = Math.max(0, Math.min(p.total, s));
  for (const g of p.segs){
    if (s <= g.start + g.d){
      const t = g.d ? (s - g.start) / g.d : 0;
      return { x: g.a.x + (g.b.x - g.a.x) * t, y: g.a.y + (g.b.y - g.a.y) * t };
    }
  }
  const g = p.segs[p.segs.length-1];
  return { x:g.b.x, y:g.b.y };
}
function laneFor(ax, bx){
  const d0 = Math.abs(ax - VERT[0]) + Math.abs(bx - VERT[0]);
  const d1 = Math.abs(ax - VERT[1]) + Math.abs(bx - VERT[1]);
  return d0 <= d1 ? VERT[0] : VERT[1];
}
function endPoint(P){
  return P.type === "desk"
    ? { x: P.standX, y: P.y - 34 * P.s }
    : { x: P.x, y: P.y };
}
function buildRoute(a, b){
  const stop = endPoint(b);
  const bx = stop.x;
  const by = stop.y;
  const ay = a.type === "desk" ? LANE_Y[a.row] : a.y;
  const pts = [{ x:a.x, y:a.y }, { x:a.x, y:ay }];
  const lane = laneFor(a.x, bx);
  pts.push({ x:lane, y:ay });
  const bLane = b.type === "desk" ? LANE_Y[b.row] : PROP_LANE;
  pts.push({ x:lane, y:bLane });
  pts.push({ x:bx, y:bLane });
  pts.push({ x:bx, y:by });
  return mkPath(pts);
}

/* ── maskotlar ── */
function buildMascots(){
  Object.values(PLACES).forEach(p => {
    if (p.type !== "desk") return;
    mascots[p.id] = {
      id:p.id, place:p, x:p.x, y:p.y - 18 * p.s,
      walking:false, hop:0, flair:0, blink:0, drift: 0,
      nextBlink: 2 + Math.random()*4, phase: Math.random()*TAU,
      col:p.c, emoji:p.emoji
    };
  });
}

/* ── olay ── */
function runEvent(ev){
  let route = ev.demo ? [ev.isci, ev.isci] : ROUTES[ev.kenar];
  if (!route){
    if (PLACES[ev.isci]) route = [ev.isci, ev.isci];
    else if (ev.isci === "telemetri") route = ["drive", "drive"];
  }
  if (!route) return;
  const A = PLACES[route[0]], B = PLACES[route[1]];
  if (!A || !B) return;

  if (A === B){ arrive(B, ev); return; }

  const carrier = mascots[A.id] || null;
  const item = { A, B, ev, carrier };
  if (carrier && (carrier.walking || jobs.some(j => j.carrier === carrier))) pending.push(item);
  else startJob(item);
  ticker(ev);
}

function startJob(item){
  const { A, B, ev, carrier } = item;
  const path = buildRoute(A, B);
  jobs.push({ A, B, carrier, ev, phase:0, s:0, path, back:null, wait:0 });
  if (carrier) carrier.walking = true;
}

function arrive(S, ev){
  const m = mascots[S.id];
  if (m){ m.hop = 1; m.flair = 1; }
  burst(S);
  if (/yayınlandı|yayinlandi/.test(ev.metin)) confettiBurst(S);
  bubble = { text: ev.metin, t: 0, life: 3.8, at: S };
  ticker(ev);
}

function burst(S){
  const y = S.type === "desk" ? S.y - 44 * S.s : S.prop.top + 10;
  for (let i = 0; i < 16; i++){
    const a = Math.random()*TAU, sp = 30 + Math.random()*90;
    parts.push({ x:S.x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 28, life:.5+Math.random()*.5,
                 c:S.c, r:1+Math.random()*1.8 });
  }
}
function confettiBurst(S){
  const cols = ["#22d3ee","#f472b6","#fbbf24","#34d399","#a78bfa"];
  const y = S.type === "desk" ? S.y - 60 : S.prop.top + 16;
  for (let i = 0; i < 36; i++){
    const a = -Math.PI/2 + (Math.random()-.5)*2.4, sp = 80 + Math.random()*190;
    confetti.push({ x:S.x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                    rot:Math.random()*TAU, vr:(Math.random()-.5)*8, life:1.8+Math.random()*.8,
                    c:cols[i%cols.length], w:4+Math.random()*4 });
  }
}

/* ── güncelleme ── */
function update(dt){
  Object.values(mascots).forEach(m => {
    if (m.hop > 0) m.hop = Math.max(0, m.hop - dt*2.4);
    if (m.flair > 0) m.flair = Math.max(0, m.flair - dt*1.5);
    if (m.blink > 0) m.blink = Math.max(0, m.blink - dt);
    if (time > m.nextBlink && m.blink === 0){ m.blink = .13; m.nextBlink = time + 2.2 + Math.random()*3.2; }
  });

  for (let i = jobs.length - 1; i >= 0; i--){
    const j = jobs[i];
    if (j.phase === 0){
      j.s += 250 * dt;
      const p = posAt(j.path, j.s);
      if (j.carrier){ j.carrier.x = p.x; j.carrier.y = p.y; }
      if (j.s >= j.path.total){
        j.phase = 1; j.wait = 0; j.s = 0;
        if (j.carrier){ const stop = endPoint(j.B); j.carrier.x = stop.x; j.carrier.y = stop.y; }
        arrive(j.B, j.ev);
      }
    } else if (j.phase === 1){
      j.wait += dt;
      if (j.wait > 0.55){
        j.phase = 2;
        const stop = endPoint(j.B);
        const pts = [...j.path.segs.map(g => g.a), stop].reverse();
        j.back = mkPath(pts);
      }
    } else {
      j.s += 250 * dt;
      const p = posAt(j.back, j.s);
      if (j.carrier){ j.carrier.x = p.x; j.carrier.y = p.y; }
      if (j.s >= j.back.total){
        if (j.carrier){
          j.carrier.x = j.A.x; j.carrier.y = j.A.y - 18 * j.A.s;
          j.carrier.walking = false;
        }
        jobs.splice(i, 1);
        const k = pending.findIndex(it => !it.carrier || !(it.carrier.walking || jobs.some(x => x.carrier === it.carrier)));
        if (k >= 0) startJob(pending.splice(k, 1)[0]);
      }
    }
  }

  for (let i = parts.length-1; i >= 0; i--){
    const q = parts[i];
    q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 140*dt; q.life -= dt;
    if (q.life <= 0) parts.splice(i, 1);
  }
  for (let i = confetti.length-1; i >= 0; i--){
    const q = confetti[i];
    q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 260*dt; q.vx *= .99; q.rot += q.vr*dt; q.life -= dt;
    if (q.life <= 0) confetti.splice(i, 1);
  }
  if (bubble){ bubble.t += dt; if (bubble.t > bubble.life) bubble = null; }
}

/* ── çizim: maskot ── */
function drawMascot(m){
  const s = scaleAtY(m.y) * 0.94;
  const walking = m.walking;
  const bob = walking ? Math.sin(time*13)*1.5 : Math.sin(time*2.2 + m.phase)*0.7;
  const jump = m.hop > 0 ? Math.sin((1 - m.hop) * Math.PI) * 9 : 0;
  const col = m.col;

  X.save();
  X.translate(m.x, m.y + bob - jump);
  X.scale(s, s);

  // gölge
  X.fillStyle = "rgba(0,0,0,.34)";
  X.beginPath(); X.ellipse(0, 26 + jump*.35, 13, 4.2, 0, 0, TAU); X.fill();

  // bacaklar
  const swing = walking ? Math.sin(time*13)*4.6 : Math.sin(time*3 + m.phase)*0.7;
  X.strokeStyle = "#0a1624"; X.lineWidth = 4.4; X.lineCap = "round";
  X.beginPath(); X.moveTo(-5, 8); X.lineTo(-5 + swing, 21); X.stroke();
  X.beginPath(); X.moveTo(5, 8); X.lineTo(5 - swing, 21); X.stroke();

  // ayakkabı
  X.strokeStyle = rgba(col, .55); X.lineWidth = 3;
  X.beginPath(); X.moveTo(-5 + swing, 21); X.lineTo(-2 + swing, 21.5); X.stroke();
  X.beginPath(); X.moveTo(5 - swing, 21); X.lineTo(8 - swing, 21.5); X.stroke();

  // gövde
  const bg = X.createLinearGradient(0, -10, 0, 16);
  bg.addColorStop(0, rgba(col, .98)); bg.addColorStop(1, rgba(col, .55));
  rr(-11.5, -8, 23, 20, 8.5); X.fillStyle = bg; X.fill();
  X.strokeStyle = rgba(col, .9); X.lineWidth = 1; X.stroke();
  // yaka
  X.strokeStyle = "rgba(255,255,255,.22)"; X.lineWidth = 1.2;
  X.beginPath(); X.moveTo(-4, -7.5); X.lineTo(0, -3.5); X.lineTo(4, -7.5); X.stroke();

  // kollar
  X.strokeStyle = rgba(col, .92); X.lineWidth = 3.5;
  let la, ra;
  if (walking){ la = Math.sin(time*13)*3; ra = -la; }
  else { la = 2 + Math.sin(time*9 + m.phase)*2.2; ra = 2 + Math.sin(time*9 + m.phase + 1.6)*2.2; }
  X.beginPath(); X.moveTo(-11, -2); X.lineTo(-15.5, 4 + la); X.stroke();
  X.beginPath(); X.moveTo(11, -2); X.lineTo(15.5, 4 + ra); X.stroke();

  // kafa
  X.beginPath(); X.arc(0, -17, 12, 0, TAU);
  const hg = X.createRadialGradient(-3, -23, 2, 0, -17, 15);
  hg.addColorStop(0, "rgba(255,255,255,.55)"); hg.addColorStop(.35, col); hg.addColorStop(1, rgba(col, .82));
  X.fillStyle = hg; X.fill();
  X.strokeStyle = rgba(col, .95); X.lineWidth = 1; X.stroke();

  // gözler
  const open = m.blink > 0 ? .18 : 1;
  [-4.4, 4.4].forEach(dx => {
    X.beginPath(); X.ellipse(dx, -17.5, 2.6, 2.8*open, 0, 0, TAU);
    X.fillStyle = "#f4fbff"; X.fill();
    X.beginPath(); X.arc(dx + .6, -17.2, 1.3*open + .2, 0, TAU);
    X.fillStyle = "#0a1622"; X.fill();
    X.beginPath(); X.arc(dx - .4, -18.6, .75, 0, TAU);
    X.fillStyle = "rgba(255,255,255,.9)"; X.fill();
  });

  // gülümseme + yanak
  X.strokeStyle = "rgba(10,25,40,.5)"; X.lineWidth = 1.1;
  X.beginPath(); X.arc(0, -12.6, 3.4, .25, Math.PI - .25); X.stroke();
  [-8, 8].forEach(dx => {
    X.beginPath(); X.arc(dx, -11.5, 2, 0, TAU);
    X.fillStyle = "rgba(255,140,180,.3)"; X.fill();
  });

  // anten
  X.strokeStyle = rgba(col, .85); X.lineWidth = 1.4;
  X.beginPath(); X.moveTo(0, -28.5); X.lineTo(0, -33.5); X.stroke();
  X.beginPath(); X.arc(0, -35, 2.7, 0, TAU);
  X.fillStyle = col; X.shadowColor = col; X.shadowBlur = 11; X.fill(); X.shadowBlur = 0;

  // kulaklık (çalışırken takılı)
  if (!walking){
    X.strokeStyle = "rgba(200,225,245,.5)"; X.lineWidth = 2;
    X.beginPath(); X.arc(0, -17, 13.5, Math.PI * 1.06, Math.PI * 1.94); X.stroke();
    X.beginPath(); X.arc(-12.6, -16, 3.2, 0, TAU); X.fillStyle = "rgba(16,28,42,.95)"; X.fill();
    X.beginPath(); X.arc(12.6, -16, 3.2, 0, TAU); X.fill();
  }

  // taşıdığı evrak
  if (walking){
    rr(-6.5, 1, 13, 11.5, 2);
    X.fillStyle = "#fbbf24"; X.shadowColor = "#fbbf24"; X.shadowBlur = 12; X.fill();
    X.shadowBlur = 0;
    X.strokeStyle = "rgba(120,60,0,.45)"; X.lineWidth = 1;
    X.beginPath(); X.moveTo(-4, 4.4); X.lineTo(4, 4.4); X.stroke();
    X.beginPath(); X.moveTo(-4, 7); X.lineTo(2, 7); X.stroke();
  }

  // teslim kıvılcımı
  if (m.flair > 0){
    X.globalAlpha = Math.min(1, m.flair*1.6);
    X.translate(0, -46 - (1 - m.flair)*12);
    X.textAlign = "center";
    X.font = "16px -apple-system,Roboto,'Noto Color Emoji',sans-serif";
    X.fillText(m.emoji, 0, 0);
  }

  X.restore();
}

/* ── çizim: uçan evrak / parçacık / balon ── */
function drawPackets(){
  jobs.forEach(j => {
    if (j.carrier) return;
    const p = posAt(j.phase === 2 ? j.back : j.path, j.s);
    const y = p.y - 12 + Math.sin(time*8)*2;
    rr(p.x - 6, y - 6, 12, 11, 2);
    X.fillStyle = "#fbbf24"; X.shadowColor = "#fbbf24"; X.shadowBlur = 16; X.fill();
    X.shadowBlur = 0;
  });
}
function drawParticles(){
  parts.forEach(q => {
    X.globalAlpha = Math.max(0, q.life);
    X.fillStyle = q.c;
    X.beginPath(); X.arc(q.x, q.y, q.r, 0, TAU); X.fill();
  });
  confetti.forEach(q => {
    X.save();
    X.globalAlpha = Math.min(1, q.life);
    X.translate(q.x, q.y); X.rotate(q.rot);
    X.fillStyle = q.c; X.fillRect(-q.w/2, -2, q.w, 4);
    X.restore();
  });
  X.globalAlpha = 1;
}
function wrapText(text, max){
  const words = String(text).split(" ");
  const lines = []; let cur = "";
  words.forEach(w => {
    if ((cur + " " + w).trim().length > max){ lines.push(cur.trim()); cur = w; }
    else cur += " " + w;
  });
  if (cur.trim()) lines.push(cur.trim());
  return lines.slice(0, 2);
}
function drawBubble(){
  if (!bubble) return;
  const S = bubble.at;
  const lines = wrapText(bubble.text, 34);
  const w = Math.min(310, Math.max(150, Math.max(...lines.map(l => l.length)) * 5.6 + 26));
  const h = 16 + lines.length * 14;
  const ax = S.x;
  const ay = S.type === "desk" ? S.y - 54 : S.prop.top + 4;
  const bx = Math.max(12 + w/2, Math.min(W - 12 - w/2, ax));
  const by = Math.max(66 + h/2, Math.min(H - 60 - h/2, ay - h/2));

  const a = Math.min(1, Math.min(bubble.t*5, (bubble.life - bubble.t)*4));
  X.save();
  X.globalAlpha = Math.max(0, a);
  X.shadowColor = rgba(S.c, .5); X.shadowBlur = 18;
  rr(bx - w/2, by - h/2, w, h, 9);
  X.fillStyle = "rgba(8,18,28,.96)"; X.fill();
  X.shadowBlur = 0;
  X.strokeStyle = rgba(S.c, .5); X.lineWidth = 1.1; X.stroke();

  X.beginPath();
  X.moveTo(bx - 5, by + h/2);
  X.lineTo(bx + 5, by + h/2);
  X.lineTo(bx, by + h/2 + 7);
  X.closePath();
  X.fillStyle = "rgba(8,18,28,.96)"; X.fill();

  X.textAlign = "center";
  X.font = "600 11px -apple-system,Roboto,sans-serif";
  X.fillStyle = "#dcecf8";
  lines.forEach((l, i) => X.fillText(l, bx, by - ((lines.length-1)*14)/2 + i*14));
  X.restore();
}

/* ── ışık / vinyet ── */
function drawLighting(){
  const key = X.createRadialGradient(360, 120, 40, 360, 120, 700);
  key.addColorStop(0, "rgba(120,210,255,.10)");
  key.addColorStop(.5, "rgba(120,210,255,.03)");
  key.addColorStop(1, "transparent");
  X.fillStyle = key; X.fillRect(0, 0, W, H);

  const v = X.createRadialGradient(640, 430, 280, 640, 430, 860);
  v.addColorStop(0, "transparent"); v.addColorStop(.7, "rgba(2,5,10,.28)"); v.addColorStop(1, "rgba(2,5,10,.66)");
  X.fillStyle = v; X.fillRect(0, 0, W, H);
}

/* ── ana çevrim ── */
function frame(now){
  if (!last) last = now;
  let dt = (now - last)/1000; last = now;
  if (dt > .1) dt = .1;
  time += dt;

  update(dt);
  drawRoom();
  drawWindow();
  drawBoard();
  drawProps();

  WORKERS.forEach(drawDesk);
  drawPackets();

  Object.values(mascots).sort((a,b) => a.y - b.y).forEach(drawMascot);

  drawParticles();
  drawBubble();
  drawLighting();

  requestAnimationFrame(frame);
}

/* ── arayüz ── */
function setMode(){
  const canli = D.mod === "canli";
  document.getElementById("mode").classList.toggle("canli", canli);
  document.getElementById("modeText").textContent = canli ? "CANLI" : (D.mod_etiketi || "REPLAY");
  document.getElementById("tkSrc").textContent = canli ? "CANLI AKIŞ" : "REPLAY · KAYITLI GERÇEK OLAYLAR";
}
let tkTimer = null;
function ticker(ev){
  const w = (D.isci || []).find(x => x.id === ev.isci);
  const col = w ? accent(ev.isci) : "#22d3ee";
  document.getElementById("tkTime").textContent = ev.t || "--:--";
  const who = document.getElementById("tkWho");
  who.textContent = ev.isci; who.style.color = col;
  const msg = document.getElementById("tkMsg");
  msg.style.opacity = 0;
  clearTimeout(tkTimer);
  tkTimer = setTimeout(() => { msg.textContent = ev.metin; msg.style.opacity = 1; }, 110);
}
function clockUI(){
  const d = new Date();
  document.getElementById("clock").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  document.getElementById("date").textContent = `${pad(d.getDate())} ${AYLAR[d.getMonth()]} ${d.getFullYear()}`;
}

/* ── replay ── */
let replayIdx = -1;
function startReplay(){
  const akis = D.akis || [];
  if (D.mod === "canli" || !akis.length) return;
  replayIdx = -1;
  const adim = () => {
    replayIdx = (replayIdx + 1) % akis.length;
    runEvent(akis[replayIdx]);
  };
  adim();
  setInterval(adim, 5200);
}

/* ── ölçek ── */
const sceneEl = document.getElementById("scene");
function fit(){
  const wrap = document.getElementById("sceneWrap");
  const w = (wrap && wrap.clientWidth) || innerWidth;
  const h = (wrap && wrap.clientHeight) || innerHeight;
  const s = Math.min(w / W, h / H);
  sceneEl.style.transform = `translate(-50%,-50%) scale(${s})`;
}

/* ── başlat ── */
function countTo(el, target, fmt){
  if (!el) return;
  const t0 = (window.performance && performance.now()) || Date.now();
  const dur = 900;
  const step = () => {
    const now = (window.performance && performance.now()) || Date.now();
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(Math.round(target * e));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function fmtGuncelleme(iso){
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return `GÜNCELLEME ${pad(d.getDate())} ${AYLAR[d.getMonth()]} ${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderStats(){
  const k = D.kanal || {}, q = D.kuyruk || {}, o = D.ozet || {}, s = D.sistem || {};
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  countTo(document.getElementById("stIzlenme"), k.izlenme || 0, v => nf.format(v));
  countTo(document.getElementById("stAbone"), k.abone || 0, v => nf.format(v));
  countTo(document.getElementById("stVideo"), k.video || 0, v => nf.format(v));
  countTo(document.getElementById("stShorts"), q.shorts || 0, v => nf.format(v));
  set("stHaftalik", `+${k.haftalik || 0} bu hafta`);
  set("stYorum", `${nf.format(k.yorum || 0)} yorum`);
  set("stBegeni", `${nf.format(k.begeni || 0)} beğeni`);
  set("stGun", `${q.gun || 0} gün yeter`);
  set("stSlot", s.slot_saati || "19:30");
  set("stSlotAlt", s.gunluk || "günde 1 Short");
  set("stSistem", `${o.ayakta || 0}/${o.toplam || 0}`);
  set("stSistemAlt", `ayakta · pasif ${o.pasif || 0}`);
  set("stNext", q.sonraki ? `${q.sonraki} — ${q.baslik || ""}` : "—");
  set("stUpdated", fmtGuncelleme(D.guncelleme));
  const qBox = document.getElementById("stQuota");
  if (qBox) qBox.innerHTML = (D.kotalar || []).map(q => {
    const lim = q.limit || 1;
    const pct = Math.max(0, Math.min(100, Math.round((q.kalan || 0) / lim * 100)));
    return `<div class="q"><div class="qt"><span>${q.ad}</span><b>%${pct}</b></div>` +
           `<div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
  const box = document.getElementById("stWorkers");
  if (box) box.innerHTML = (D.isci || []).map(x => {
    const meta = WORKERS.find(w => w.id === x.id);
    const label = meta ? meta.label : x.id;
    const col = DURUM_RENK[x.durum] || "#64748b";
    return `<span class="wchip"><i style="background:${col};box-shadow:0 0 6px ${col}"></i>${label}</span>`;
  }).join("");
  fit();
}

function boot(data){
  D = data || FALLBACK;
  buildMascots();
  setMode(); clockUI(); renderStats();
  setInterval(clockUI, 1000);
  startReplay();
  if (!last) requestAnimationFrame(frame);
}
function init(){
  setupCanvas(); fit();
  addEventListener("resize", fit);
  addEventListener("orientationchange", () => setTimeout(fit, 120));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  setInterval(fit, 400);
  fetch("./data/canli.json", { cache:"no-store" })
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(j => boot(j))
    .catch(() => boot(FALLBACK));
}
document.getElementById("fs").addEventListener("click", () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});
init();
</script>
